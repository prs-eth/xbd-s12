# @package _global_
defaults:
  - model: siamese

run_name: ??? # Must be set when running the code
task: multiclass # "multiclass" or "localization"
extra_buffer_for_evaluation: null # e.g., 2 or [1,2,3]
num_workers: 8
debug: false
seed: 42

training:
  max_epochs: 40
  batch_size: 8
  early_stopping: null
  lr: 0.0005
  weight_decay: 0.0001
  use_transforms: true
  sampler_train: weighted # "weighted" or null

scheduler:
  name: cosine_with_warmup
  warmup_epochs: 3
  total_epochs: ${training.max_epochs}

loss:
  name: ce
  ignore_index: 99
  reduction: mean

data:
  which_split: event # choose between xview2 (the original split) or event (new split by events from Hafner et al. 2025)
  modalities:
    - s1
    - s2
  fraction_valid: 0.15
  s2_bands: all
  s1_bands: all
  downsample_factor: 8 # Always 8 to downsample the origial mask (1024x1024) to 128x128
  use_hdf5: false # ues hdf5 instead of loading images from files
  hdf5_path: null # must be set if use_hdf5 is true
  remove_tiles_without_buildings: false
  pixels_buffer_around_buildings: 3

# Logging
logger: wandb  # Can be either None (no logging), "local" (only log images to local files) or "wandb" (log to Weights & Biases)
wandb_project: xbd-s12
wandb_tags: null
plot_per_train: null # Number of batches plotted during each epoch for training. Set to null to disable plotting during training.
plot_per_valid: 3 # Same for validation.
plot_per_test: 5 # Same for test.



# Hydra config overrides:
hydra:
  run:
    dir: logs/${run_name}
  sweep:
    dir: logs/${run_name}
  job_logging:
    root: null # (prevent ot automatically write a file .log)
