[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "xbd-s12"
version = "1.0.0"
description = "Source code for the xBD-S12 project"
authors = [{ name = "Olivier Dietrich", email = "odietrich@ethz.ch" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rasterio>=1.4.3",
    "pyproj>=3.7.0",
    "geopandas>=1.1.1",
    "rioxarray>=0.22.0",
    "shapely>=2.0.4",
    "fiona>=1.10.0",
    "h5py>=3.16.0",
    "hydra-core>=1.3.2",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "opencv-python>=4.13.0.92",
    "scikit-learn>=1.8.0",
    "segmentation-models-pytorch>=0.5.0",
    "torch>=2.11.0",
    "tqdm>=4.67.3",
    "wandb>=0.25.1",
    "gdal==3.6.2.*",
    "geemap==0.37.2",
    "retry>=0.9.2",
    "geedim>=2.0.0",
    "phidown>=0.1.26",
    "dask>=2026.3.0",
    "torchgeo==0.7.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.8",
]

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "D",   # pydocstyle (replaces flake8-docstrings)
]
ignore = [
    "D100",  # Missing docstring in public module
    "D101",  # Missing docstring in public class
    "D102",  # Missing docstring in public method
    "D103",  # Missing docstring in public function
    "D104",  # Missing docstring in public package
    "D105",  # Missing docstring in magic method
    "D107",  # Missing docstring in __init__
    "D202",  # No blank lines allowed after function docstring
    "D212",  # Multi-line docstring summary should start at the first line
    "D415",  # First line should end with a period, question mark, or exclamation point
    "E203",  # Whitespace before ':'
    "E226",  # Missing whitespace around arithmetic operator
    "E228",  # Missing whitespace around modulo operator
]
# W503 doesn't exist in ruff — it enforces the opposite (W504) by default, which is correct per PEP 8

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
